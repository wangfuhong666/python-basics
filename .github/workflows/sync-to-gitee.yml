name: Sync to Gitee

# 把 GitHub 上的提交自动同步到 Gitee。
# 覆盖所有分支与标签，但只做快进（fast-forward）推送：
# 某个分支如果在两端已分叉，本工作流会失败并点名是哪个分支，而不是 force push 覆盖。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只跑一个同步任务，避免多次推送互相干扰
concurrency:
  group: sync-to-gitee
  cancel-in-progress: false

env:
  GITEE_USER: wang_fuhong
  GITEE_REPO: python-basics

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出全部历史（含所有分支与标签）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 把所有分支与标签推送到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::仓库未配置 GITEE_TOKEN secret，无法同步到 Gitee。"
            echo "::error::请在 GitHub 仓库 Settings → Secrets and variables → Actions 中添加 GITEE_TOKEN（Gitee 私人令牌，需 projects 权限）。"
            exit 1
          fi

          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${GITEE_REPO}.git"

          failed=0
          # 逐个分支做快进推送：不存在则创建，已最新则自动跳过，分叉则报错
          for br in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -vx 'HEAD' || true); do
            echo "::group::分支 ${br}"
            if git push gitee "refs/remotes/origin/${br}:refs/heads/${br}"; then
              echo "✅ ${br} 已同步到 Gitee"
            else
              echo "::error::分支 ${br} 推送失败：两端历史可能已分叉，本工作流不会 force push 覆盖。"
              failed=1
            fi
            echo "::endgroup::"
          done

          if git push gitee --tags; then
            echo "✅ 标签已同步"
          else
            echo "::warning::标签同步未完全成功（不影响分支同步结果）"
          fi

          exit ${failed}
